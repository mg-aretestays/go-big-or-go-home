name: Update league data

on:
  schedule:
    # Off the top of the hour: GitHub delays or drops scheduled runs at :00 when it is busy.
    - cron: "17 11 * * 2"  # Tuesdays 11:17 UTC (5-6am CT), after Monday Night Football
    - cron: "17 11 * * 5"  # Fridays 11:17 UTC, picks up the week's NFL stat corrections
  workflow_dispatch:      # "Run workflow" button for a manual refresh

permissions:
  contents: write

concurrency: update-data

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Restore cached FantasyPros pages
        uses: actions/cache@v4
        with:
          path: .fp_cache
          key: fp-${{ github.run_id }}
          restore-keys: fp-
      - run: python export_site_data.py
      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add docs/data.json
          git diff --cached --quiet || { git commit -m "Update league data"; git push; }
